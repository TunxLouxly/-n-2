<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang quản trị - TunxPet</title>
    <link rel="stylesheet" href="TrangChu.css">
    <link rel="stylesheet" href="QuanTri.css">
    <link rel="stylesheet" href="YeuCau.css">
</head>
<!-- data-quyen: chỉ quản trị viên và nhân viên mới được vào trang này -->
<body data-quyen="quantri,nhanvien">

    <header class="header">
        <div class="container header-inner">
            <a href="QuanTri.html" class="logo">🐾 TunxPet <small>Quản trị</small></a>
            <a href="TrangChu.html" class="btn-lien-he">← Về trang chủ</a>
            <!-- XacThuc.js sẽ tự điền tên người dùng và nút Đăng xuất vào đây -->
            <div class="tai-khoan"></div>
        </div>
    </header>

        <!-- ===== TRANG QUẢN TRỊ ===== -->
    <main class="qt-trang">

        <!-- Menu bên trái -->
        <aside class="qt-menu">
            <h2>Quản trị TunxPet</h2>
            <button type="button" class="qt-tab hien" data-tab="tongquan">📊 Tổng quan</button>
            <button type="button" class="qt-tab" data-tab="yeucau">📋 Đơn nhận nuôi <span class="qt-chip" id="chipYeuCau"></span></button>
            <button type="button" class="qt-tab" data-tab="thucung">🐾 Thú cưng</button>
            <button type="button" class="qt-tab" data-tab="danhgia">⭐ Đánh giá</button>
            <button type="button" class="qt-tab chi-quantri" data-tab="taikhoan">👥 Tài khoản</button>
        </aside>

        <!-- Nội dung từng mục (do các file QuanTri*.js tự vẽ vào) -->
        <div class="qt-noidung">
            <section class="qt-muc hien" id="muc-tongquan"></section>
            <section class="qt-muc" id="muc-yeucau"></section>
            <section class="qt-muc" id="muc-thucung"></section>
            <section class="qt-muc" id="muc-danhgia"></section>
            <section class="qt-muc" id="muc-taikhoan"></section>
        </div>

    </main>

    <script src="DuLieuThuCung.js"></script>
    <script src="DuLieuYeuCau.js"></script>
    <script src="Chung.js"></script>
    <script src="XacThuc.js"></script>
    <script src="QuanTri.js"></script>
    <script src="QuanTriYeuCau.js"></script>
    <script src="QuanTriThuCung.js"></script>
    <script src="QuanTriDanhGia.js"></script>
    <script src="QuanTriTaiKhoan.js"></script>
</body>
</html>
